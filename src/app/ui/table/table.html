<table class="table table-sm" style="width: 70%">
  <thead>
    <tr>
      <th scope="col"></th>
      <th scope="col">Task</th>
      <th scope="col">Due Date</th>
      <th scope="col" style="width: 0%">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let todo of todos">
      <th scope="row">
        <input
          class="form-check-input"
          type="checkbox"
          [checked]="todo.completed"
          (change)="toggleComplete(todo)"
        />
      </th>
      <td>{{todo.task}}</td>
      <td>{{todo.due_date}}</td>
      <td>
        <div class="d-flex column-gap-2">
          <app-button icon="bi bi-pencil-fill" cssClass="btn btn-secondary btn-sm" [disabled]="todo.completed===true?true:false" ></app-button>
          <app-button icon="bi bi-trash-fill" cssClass="btn btn-danger btn-sm" [disabled]="todo.completed===true?true:false"></app-button>
        </div>
      </td>
    </tr>
  </tbody>
</table>
