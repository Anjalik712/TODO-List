<table class="table" style="width: 70%;">
  <thead>
    <tr>
      <th scope="col"></th>
      <th scope="col">Task</th>
      <th scope="col">Due Date</th>
      <th scope="col" style="width: 0%;">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let todo of todos">
      <th scope="row">
        <input
          class="form-check-input"
          type="checkbox"
          id="checkDefault"
          [checked]="todo.completed"
          (change)="toggleComplete(todo)"
        />
      </th>
      <td>{{todo.task}}</td>
      <td>{{todo.due_date}}</td>
      <td>
        <div class="d-flex column-gap-2">
          <app-button label="Edit" cssClass="btn btn-secondary"></app-button>
          <app-button label="Delete" cssClass="btn btn-danger"></app-button>
        </div>
      </td>
    </tr>
  </tbody>
</table>
