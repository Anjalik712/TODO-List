<table class="table table-sm">
  <thead>
    <tr>
      <th scope="col"></th>
      <th scope="col">Task</th>
      <th scope="col">Due Date</th>
      <th scope="col" >Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let pendingTask of pendingTasks()">
      <th scope="row">
        <input
          class="form-check-input"
          type="checkbox"
          id="checkDefault"
          [checked]="pendingTask.completed"
          (change)="toggleComplete(pendingTask)"
        />
      </th>
      <td>{{pendingTask.task}}</td>
      <td>{{pendingTask.dueDate}}</td>
      <td>
        <div class="d-flex column-gap-2">
          <app-button
            icon="bi bi-pencil-fill"
            cssClass="btn btn-sm"  
          ></app-button> 
          <app-button
            icon="bi bi-trash-fill"
            cssClass="btn btn-sm"
          ></app-button>
        </div>
      </td>
    </tr>
    <tr>
      <td></td>
      <th colspan="3">Completed Tasks</th>
    </tr>
    <tr *ngFor="let completedTask of completedTasks()">
      <th scope="row">
        <input
          class="form-check-input"
          type="checkbox"
          id="checkDefault"
          [checked]=true
        />
      </th>
      <td>{{completedTask.task}}</td>
      <td>{{completedTask.dueDate}}</td>
      <td colspan="2"></td>
    </tr>
  </tbody>
</table>
