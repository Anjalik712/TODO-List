<div
  class="modal fade"
  [id]="id"
  tabindex="-1"
  [attr.aria-labelledby]="id + 'Label'"
>
  <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" [id]="id + 'Label'">{{ title }}</h5>
        <button
          type="button"
          class="btn-close focus-ring"
          data-bs-dismiss="modal"
          aria-label="Close"
          id="close-button"
        ></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="todoForm" id="{{ id }}" (ngSubmit)="submitHandler()">
          <div class="row mb-3">
            <label for="task" class="col-form-label col-sm-3">
              {{ 'PAGE.LABELS.TASK' | translate }}
            </label>
            <div class="col-sm-9">
              <input
                id="task"
                type="text"
                formControlName="task"
                class="form-control focus-ring"
              />
            </div>
          </div>
          <div class="row mb-3">
            <label for="duedate" class="col-form-label col-sm-3">
              {{ 'PAGE.LABELS.DUE_DATE' | translate }}
            </label>
            <div class="col-sm-9">
              <input
                id="duedate"
                type="date"
                formControlName="dueDate"
                class="form-control focus-ring"
              />
            </div>
          </div>
          <div class="d-flex justify-content-end">
            <app-button
              id="{{ id }}-submit-button"
              [label]="'PAGE.BUTTONS.SUBMIT' | translate"
              type="submit"
              cssClass="btn btn-success"
              dismiss="modal"
              [disabled]="!todoForm.valid"
            />
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
